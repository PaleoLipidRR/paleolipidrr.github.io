name: CV links check

on:
  pull_request:
    branches:
      - main
    paths:
      - _data/cv.json
      - _data/cv_links.yml
      - _data/cv_figures.yml
      - _pages/cv.md
      - bin/check_cv_links.py
      - test/test_check_cv_links.py
      - .github/workflows/cv-links.yml
  push:
    branches:
      - main
    paths:
      - _data/cv.json
      - _data/cv_links.yml
      - _data/cv_figures.yml
      - _pages/cv.md
      - bin/check_cv_links.py
      - test/test_check_cv_links.py
      - .github/workflows/cv-links.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Test the checker
        run: pytest test/test_check_cv_links.py
      - name: Check cv_links.yml and cv_figures.yml against the CV entries and the image files
        run: python3 bin/check_cv_links.py _data/cv.json _data/cv_links.yml _data/cv_figures.yml .
